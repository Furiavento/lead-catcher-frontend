<a class="skip-link" href="#main-content" (click)="$event.preventDefault(); main.focus()"
  >Saltar al contenido</a
>

<mat-sidenav-container class="container">
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <div class="brand">
      <mat-icon aria-hidden="true">radar</mat-icon>
      <span>Lead Catcher</span>
    </div>
    <nav aria-label="Menú principal">
      <mat-nav-list>
        @for (item of navItems; track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive
            #rla="routerLinkActive"
            [activated]="rla.isActive"
            [attr.aria-current]="rla.isActive ? 'page' : null"
            (click)="isHandset() && drawer.close()"
          >
            <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      @if (isHandset()) {
        <button mat-icon-button type="button" aria-label="Abrir menú" (click)="drawer.toggle()">
          <mat-icon aria-hidden="true">menu</mat-icon>
        </button>
      }
      <span class="spacer"></span>
      <button mat-button type="button" [matMenuTriggerFor]="userMenu" aria-label="Menú de usuario">
        <mat-icon aria-hidden="true">account_circle</mat-icon>
        <span class="user-email">{{ email() }}</span>
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        <button mat-menu-item type="button" (click)="changePassword()">
          <mat-icon aria-hidden="true">key</mat-icon>
          <span>Cambiar contraseña</span>
        </button>
        <mat-divider />
        <button mat-menu-item type="button" (click)="logout()">
          <mat-icon aria-hidden="true">logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main #main id="main-content" class="content" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
